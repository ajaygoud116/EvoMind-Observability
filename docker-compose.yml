version: "3.9"

services:
  # ============================================================
  # EvoMind Observability — the actual application
  # Requires Foundry-deployed SigNoz for telemetry backend.
  # See README.md for full deployment instructions.
  # ============================================================
  evomind:
    build: .
    container_name: evomind
    environment:
      EVOMIND_OTEL_EXPORTER_ENDPOINT: http://host.docker.internal:4317
      EVOMIND_OTEL_ENABLED: "true"
      EVOMIND_DATABASE_PATH: /data/evomind.db
      EVOMIND_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - evomind-data:/data

volumes:
  evomind-data:

networks:
  default:
    name: evomind-net
    driver: bridge
